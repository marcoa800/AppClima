[project]
name = "appclima"
version = "0.1.0"
description = "Plataforma de datos abiertos de clima, sismos y biodiversidad"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "tenacity>=9.0",
    "duckdb>=1.1",
    # DuckDB lo necesita para convertir TIMESTAMP WITH TIME ZONE a datetime de
    # Python. No es opcional aunque no aparezca en sus dependencias declaradas:
    # sin él, cualquier consulta que devuelva un timestamptz sin castear a
    # VARCHAR lanza ModuleNotFoundError desde dentro del motor.
    "pytz>=2024.1",
    "pyarrow>=18.0",
    "pandas>=2.2",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
appclima = "appclima.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appclima"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
