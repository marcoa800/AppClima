name: Ingesta diaria

# El horario importa. ERA5 tiene ~5 días de latencia y USGS revisa magnitudes
# durante días, así que no hay ninguna ventaja en madrugar. 06:15 UTC evita
# además el minuto en punto, cuando GitHub tiene su pico de crons y las
# ejecuciones se encolan.
# Cuatro horarios, uno por cadencia. Cada nivel incluye a los anteriores, así
# que el domingo 1 de mes se ejecutan los cuatro y basta con que gane el más
# amplio — por eso el paso elige la cadencia MÁXIMA que aplique hoy.
#
# Sin esto el cron refrescaba solo tres de las once fuentes y dejaba envejecer
# ocho en silencio, que es justo lo que este proyecto no puede permitirse.
on:
  schedule:
    - cron: '15 6 * * *'      # diario: clima, sismos, aves
    - cron: '35 6 * * 0'      # domingos: + ciclones
    - cron: '55 6 1 * *'      # día 1: + índice ONI
    - cron: '15 7 1 1 *'      # 1 de enero: + población, desastres, fenología
  workflow_dispatch:
    inputs:
      cadence:
        description: 'daily | weekly | monthly | yearly | full'
        default: 'daily'

# Necesario para actualizar los assets de la release, que es donde vive el
# estado persistente cuando no hay R2 configurado.
permissions:
  contents: write

concurrency:
  # Dos ingestas simultáneas escribirían en bronze a la vez. Bronze es
  # append-only y silver deduplica, así que no corrompería nada — pero
  # duplicaría el consumo de cuota de Open-Meteo sin ganar nada.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A nivel de job, no de paso. El contexto `env` de un `if:` solo ve las
    # variables declaradas en el job o el workflow: si R2_BUCKET se declara
    # dentro del paso, su propio `if` la ve vacía y el paso nunca se ejecuta.
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --all-extras

      # **El paso más importante del workflow.** Sin él cada ejecución empieza
      # con bronze vacío, y el warehouse resultante sale sin climatología, sin
      # anomalías y sin modelo de réplicas: los backfills históricos —20 años de
      # ERA5 y el catálogo sísmico— viven en bronze y no se reingieren a diario.
      #
      # Se comprobó a las malas: la primera ejecución sin este paso construyó un
      # warehouse con 2 regímenes de cobertura en vez de 5, y los tests lo
      # cazaron con `assert 2 >= 4`.
      #
      # Dos orígenes, por orden de preferencia:
      #   1. R2, si está configurado
      #   2. el asset `bronze.tar.zst` de la release, que no necesita cuenta de
      #      Cloudflare y hace que el proyecto sea autosuficiente en GitHub
      - name: Restaurar bronze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if [ -n "$R2_BUCKET" ]; then
            echo "Origen: R2"
            aws s3 sync "s3://$R2_BUCKET/bronze" data/bronze --no-progress
          else
            echo "Origen: asset de la release"
            gh release download warehouse \
              --pattern bronze.tar.zst --dir /tmp --clobber
            zstd -dc /tmp/bronze.tar.zst | tar -x
            # Defensa: si el archivo se creó en macOS puede traer ficheros
            # AppleDouble (._algo.parquet) con los atributos extendidos. En
            # Linux quedan como ficheros sueltos, el glob **/*.parquet los
            # captura y DuckDB revienta con "No magic bytes found at end of
            # file". Costó una ejecución entera descubrirlo.
            find data/bronze -name '._*' -delete 2>/dev/null || true
          fi
          du -sh data/bronze

      # La cadencia se deduce de la FECHA, no del cron que disparó, porque
      # GitHub no dice cuál de los cuatro horarios lo lanzó. Se elige siempre la
      # más amplia que aplique hoy.
      - name: Determinar cadencia
        id: cadence
        run: |
          if [ -n "${{ inputs.cadence }}" ]; then
            CADENCE="${{ inputs.cadence }}"
          elif [ "$(date -u +%j)" = "001" ]; then
            CADENCE=yearly
          elif [ "$(date -u +%d)" = "01" ]; then
            CADENCE=monthly
          elif [ "$(date -u +%u)" = "7" ]; then
            CADENCE=weekly
          else
            CADENCE=daily
          fi
          echo "value=$CADENCE" >> "$GITHUB_OUTPUT"
          echo "Cadencia de hoy: $CADENCE"

      - name: Ingerir
        env:
          APPCLIMA_EBIRD_TOKEN: ${{ secrets.EBIRD_TOKEN }}
          APPCLIMA_USER_AGENT: 'AppClima/0.1 (github.com/${{ github.repository }})'
        run: uv run appclima ingest all --cadence ${{ steps.cadence.outputs.value }}

      - name: Construir silver y gold
        run: uv run appclima build

      - name: Resumen
        run: uv run appclima status

      # El build no basta como comprobación: puede construir 27 tablas sobre
      # datos rancios sin quejarse. Los tests sí detectan si un supuesto se
      # rompió — por ejemplo el que vigila que la correlación cobertura-año
      # siga por encima de 0,8.
      - name: Tests sobre el warehouse recién construido
        run: uv run pytest -q

      # Solo se persiste si los tests pasaron: el `needs` implícito de los pasos
      # secuenciales ya lo garantiza. Publicar un bronze corrupto sería peor que
      # no publicar nada, porque contaminaría todas las ejecuciones siguientes.
      - name: Persistir bronze y warehouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$R2_BUCKET" ]; then
            aws s3 sync data/bronze "s3://$R2_BUCKET/bronze" --no-progress
            aws s3 cp data/appclima.duckdb "s3://$R2_BUCKET/appclima.duckdb"
          else
            # COPYFILE_DISABLE y --exclude por si algún día se archiva desde
            # macOS: su tar embebe los atributos extendidos como ficheros ._*.
            COPYFILE_DISABLE=1 tar -c --exclude='._*' --exclude='.DS_Store' \
              data/bronze | zstd -19 -T0 -q -o bronze.tar.zst -f
            gh release upload warehouse \
              bronze.tar.zst data/appclima.duckdb --clobber
            ls -lh bronze.tar.zst data/appclima.duckdb
          fi

