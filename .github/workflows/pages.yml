name: Publicar sitio estático

# Publica la web como sitio ESTÁTICO, sin servidor de API.
#
# El payload completo son 5,6 MB de JSON, así que cabe en cualquier hosting
# estático gratuito. Frente a desplegar FastAPI: 0 € en vez de 5-20 €/mes, sin
# rate limiting, sin caídas posibles y servido desde CDN.
#
# No rompe la arquitectura: los JSON estáticos SON el contrato de la API,
# materializado. FastAPI se queda para desarrollo local y para el cliente de iOS,
# que sí necesita consultas con parámetros.

on:
  # Tras cada ingesta correcta: el sitio se republica con los datos frescos.
  workflow_run:
    workflows: ['Ingesta diaria']
    types: [completed]
  push:
    branches: [main]
    paths: ['web/**', 'src/appclima/api/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Si la ingesta falló, no republicar: mejor datos de ayer que datos rotos.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # El warehouse NO se reconstruye aquí, y el motivo es importante:
      # `ingest all --cadence full` cubre las once fuentes pero NO los backfills
      # históricos, que son operaciones puntuales y no periódicas — los 20 años
      # de reanálisis ERA5 y el catálogo sísmico desde 2016. Sin ellos el
      # warehouse sale sin climatología, sin anomalías y sin modelo de calor:
      # el sitio se publicaría roto.
      #
      # Así que se descarga ya construido. Dos orígenes, por orden:
      #   1. R2, que es donde lo deja el workflow de ingesta diaria
      #   2. el asset de la release `warehouse`, que no necesita cuenta de
      #      Cloudflare y basta para publicar hoy
      - name: Recuperar el warehouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if [ -n "$R2_BUCKET" ]; then
            echo "Origen: R2 (datos frescos de la ingesta diaria)"
            aws s3 cp "s3://$R2_BUCKET/appclima.duckdb" data/appclima.duckdb
          else
            echo "Origen: asset de la release (sin R2 configurado)"
            gh release download warehouse \
              --pattern appclima.duckdb --dir data --clobber
          fi
          ls -lh data/appclima.duckdb

      - name: Exportar la API a JSON estático
        run: uv run appclima export --out web/public/api

      # VITE_BASE tiene que coincidir con el subdirectorio donde Pages sirve el
      # sitio. Se toma del nombre real del repositorio para que renombrarlo no
      # rompa el despliegue en silencio — el síntoma sería una página en blanco
      # sin ningún error.
      - name: Construir la web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm ci && npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
