name: Publicar sitio estático

# Publica la web como sitio ESTÁTICO, sin servidor de API.
#
# El payload completo son 5,6 MB de JSON, así que cabe en cualquier hosting
# estático gratuito. Frente a desplegar FastAPI: 0 € en vez de 5-20 €/mes, sin
# rate limiting, sin caídas posibles y servido desde CDN.
#
# No rompe la arquitectura: los JSON estáticos SON el contrato de la API,
# materializado. FastAPI se queda para desarrollo local y para el cliente de iOS,
# que sí necesita consultas con parámetros.

on:
  # Tras cada ingesta correcta: el sitio se republica con los datos frescos.
  workflow_run:
    workflows: ['Ingesta diaria']
    types: [completed]
  push:
    branches: [main]
    paths: ['web/**', 'src/appclima/api/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Si la ingesta falló, no republicar: mejor datos de ayer que datos rotos.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # **Se descarga BRONZE y se reconstruye, no se descarga el warehouse.**
      #
      # Distribuir el warehouse ya construido lo acopla al código: al añadir un
      # modelo nuevo, el warehouse de la release no lo tenía y la exportación
      # fallaba con "Table gold_heat_threshold_drift does not exist". Pasó de
      # verdad.
      #
      # Es además el principio que sostiene todo el proyecto y que aquí se
      # estaba incumpliendo: bronze es lo único duradero, y silver y gold se
      # reconstruyen desde cero cuando cambia la lógica. Reconstruir cuesta un
      # minuto y garantiza que el sitio publicado corresponde al código
      # publicado.
      #
      # Lo que NO se hace aquí es reingerir: los backfills históricos —20 años
      # de ERA5 y el catálogo sísmico— son operaciones puntuales que viven en
      # bronze y no se reingieren nunca.
      - name: Recuperar bronze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if [ -n "$R2_BUCKET" ]; then
            echo "Origen: R2"
            aws s3 sync "s3://$R2_BUCKET/bronze" data/bronze --no-progress
          else
            echo "Origen: asset de la release"
            gh release download warehouse \
              --pattern bronze.tar.zst --dir /tmp --clobber
            zstd -dc /tmp/bronze.tar.zst | tar -x
            find data/bronze -name '._*' -delete 2>/dev/null || true
          fi
          du -sh data/bronze

      - name: Construir el warehouse desde bronze
        run: uv run appclima build

      - name: Exportar la API a JSON estático
        run: uv run appclima export --out web/public/api

      # VITE_BASE tiene que coincidir con el subdirectorio donde Pages sirve el
      # sitio. Se toma del nombre real del repositorio para que renombrarlo no
      # rompa el despliegue en silencio — el síntoma sería una página en blanco
      # sin ningún error.
      - name: Construir la web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm ci && npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
